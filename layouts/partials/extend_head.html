{{- /* Recipe Schema Markup - Only for chicken-tikka-masala */ -}}
{{- if and (.IsPage) (eq .File.BaseFileName "chicken-tikka-masala") (.Params.rating) -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Recipe",
  "name": "{{ .Title }}",
  "image": [
    "{{ .Site.BaseURL }}images/kitchen-bg.jpg"
  ],
  "author": {
    "@type": "Organization",
    "name": "Wheeler World Kitchen"
  },
  "datePublished": "{{ .PublishDate.Format "2006-01-02" }}",
  "description": "{{ .Params.description }}",
  "prepTime": "{{ .Params.prepTime }}",
  "cookTime": "{{ .Params.cookTime }}",
  "totalTime": "{{ .Params.totalTime }}",
  "keywords": "{{ range $index, $tag := .Params.tags }}{{ if $index }}, {{ end }}{{ $tag }}{{ end }}",
  "recipeYield": "{{ .Params.servings }} servings",
  "recipeCategory": "Main Course",
  "recipeCuisine": "{{ index .Params.categories 0 }}",
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{ .Params.rating }}",
    "ratingCount": "1"
  },
  "recipeIngredient": [
    "2 lbs diced small chunks chicken thighs",
    "1/2 cup greek yogurt plain",
    "1 tsp red chili powder (use what you got but kashmiri is recommended)",
    "1 tsp garam masala",
    "1/2 tsp turmeric",
    "1 tsp coriander powder",
    "1/2 tsp cumin powder",
    "1 tsp salt",
    "1 tbsp lemon juice",
    "1 tbsp kasuri methi",
    "1 tbsp ginger, garlic paste (if bought separately, add 1 tbsp of each)",
    "1 tbsp vegetable oil",
    "3 tbsp vegetable oil",
    "1 large yellow onion diced small",
    "1 jalapeno minced (optional)",
    "1 tsp salt",
    "1 tbsp ginger, garlic paste (if bought separately, add 1 tbsp of each)",
    "1 tsp red chili powder",
    "2 tsp garam masala",
    "1 tbsp coriander powder",
    "1.5 tsp cumin powder",
    "1-2 tsp sugar",
    "1.25 lbs fresh tomatoes (pureed, can be done before or in pot using immersion blender)",
    "1 cup hot water",
    "0.5 cup heavy whipping cream"
  ],
  "recipeInstructions": [
    {
      "@type": "HowToStep",
      "name": "Marinate and cook chicken",
      "text": "Mix all marinade items together and marinade min of 4 hours, preferably overnight or all day. Cook in sauce pan that barely holds them (goal is to cook them in their own juice). Cook on medium heat until bubbling. Lower heat a bit, just enough to keep bubbling and cook until cooked through."
    },
    {
      "@type": "HowToStep",
      "name": "Prepare rice",
      "text": "Make rice and set aside."
    },
    {
      "@type": "HowToStep",
      "name": "Sauté aromatics",
      "text": "In large pan or pot, heat oil and add onion and pepper if using. Saute until golden. Add ginger/garlic paste and saute for 30 seconds or until aromatic. Reduce heat to low and add chili powder, coriander, garam masala, and cumin. Stir together quickly."
    },
    {
      "@type": "HowToStep",
      "name": "Cook tomato sauce",
      "text": "Immediately after the above is stirred, add tomatoes and cook on med high heat until sauce becomes thick. This can take up to 10 minutes but probably less."
    },
    {
      "@type": "HowToStep",
      "name": "Simmer sauce",
      "text": "Add hot water and bring to rolling boil and cover. Simmer until thick (10-15 minutes)."
    },
    {
      "@type": "HowToStep",
      "name": "Add cream",
      "text": "Add sugar and cream to sauce and simmer for a few minutes."
    },
    {
      "@type": "HowToStep",
      "name": "Combine chicken and sauce",
      "text": "IF sauce is thick (if not, cook more first), add chicken (cooked) to pot and simmer for another few minutes."
    },
    {
      "@type": "HowToStep",
      "name": "Final seasoning and serve",
      "text": "Taste test and add more salt or garam masala or sugar as needed. Serve. Garnish with more cream or chopped coriander leaves if you have them (not essential)."
    }
  ]
}
</script>
{{- end -}}
