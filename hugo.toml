# Site configuration
baseURL = "https://wheelerworldkitchen.com/"
languageCode = "en-us"
title = "Wheeler World Kitchen"
theme = "PaperMod"

# Google Analytics
googleAnalytics = "G-2546PJ56CN"

[params]
  # Enable search
  showSearchPage = true
  
  # Force light mode - disable dark theme
  defaultTheme = "light"
  disableThemeToggle = true
  
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Our Story"
url = "/story/"
weight = 2

[[menu.main]]
name = "Recipes"
url = "/recipes/"
weight = 3

[[menu.main]]
name = "Contact"
url = "/contact/"
weight = 4

[[menu.main]]
name = "Search"
url = "/search/"
weight = 5

[[menu.main]]
name = "ChefWinston"
url = "/ChefWinston/"
weight = 6

[markup.goldmark.renderer]
unsafe = true